<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agentic Discovery — Slides — Locked</title>
<meta name="robots" content="noindex,nofollow" />
<meta name="description" content="Encrypted research draft. Password required." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<style>
  :root {
    --accent:#4f46e5; --accent-strong:#4338ca; --bg:#fafafa; --text:#1a1f36;
    --soft:#4a5568; --muted:#718096; --border:#e5e7eb;
    --display:"Newsreader",Georgia,serif; --body:"Inter",-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--body); color:var(--text);
    background:
      radial-gradient(circle at 20% 12%,#eef2ff,transparent 50%),
      radial-gradient(circle at 80% 88%,#ecfdf5,transparent 50%),
      var(--bg);
    display:grid; place-items:center; padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  .gate{
    width:100%; max-width:420px; background:#fff;
    border:1px solid var(--border); border-radius:18px;
    padding:34px 32px;
    box-shadow:0 24px 60px rgba(15,23,42,0.08), 0 4px 12px rgba(15,23,42,0.04);
  }
  .brand{display:flex; align-items:center; gap:12px; margin-bottom:6px}
  .brand-mark{
    width:40px; height:40px; border-radius:10px;
    background:linear-gradient(135deg,#4f46e5,#10b981);
    color:white; display:grid; place-items:center;
    font-family:var(--display); font-weight:600; font-size:18px;
  }
  .brand-text .n{font-weight:700; font-size:15px}
  .brand-text .s{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em}
  h1{font-family:var(--display); font-weight:600; font-size:24px; letter-spacing:-.01em; margin:18px 0 8px}
  p{color:var(--soft); font-size:13.5px; line-height:1.6; margin-bottom:14px}
  .row{display:flex; flex-direction:column; gap:8px; margin-top:14px}
  input{
    font-family:var(--body); font-size:15px; padding:12px 14px;
    border:1.5px solid var(--border); border-radius:10px;
    outline:none; transition:border-color 120ms;
    background:white; color:var(--text);
  }
  input:focus{border-color:var(--accent)}
  button{
    font-family:var(--body); font-size:14px; font-weight:600;
    padding:12px 14px; background:var(--accent); color:white;
    border:none; border-radius:10px; cursor:pointer; transition:background 120ms;
  }
  button:hover{background:var(--accent-strong)}
  button:disabled{opacity:.6; cursor:wait}
  .err{color:#b91c1c; font-size:12.5px; margin-top:8px; min-height:1em}
  .meta{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:18px; padding-top:14px; border-top:1px solid var(--border);
    font-size:11px; color:var(--muted); letter-spacing:.04em;
  }
  noscript p{color:#b91c1c; margin-top:14px}
</style>
</head>
<body>
  <main class="gate" id="gate" role="main" aria-label="Unlock paper">
    <div class="brand">
      <div class="brand-mark">AD</div>
      <div class="brand-text">
        <div class="n">Agentic Discovery</div>
        <div class="s">Encrypted Working Draft</div>
      </div>
    </div>
    <h1>This page is locked.</h1>
    <p>The contents of this page are AES-256 encrypted. Enter the access password to decrypt and read in your browser. Nothing is sent over the network — decryption happens locally.</p>
    <form id="f" class="row" autocomplete="off">
      <input id="pw" type="password" placeholder="Access password" autocomplete="off" autofocus />
      <button id="b" type="submit">Unlock</button>
      <div class="err" id="err" role="alert">&nbsp;</div>
    </form>
    <noscript><p>JavaScript is required to decrypt this page.</p></noscript>
    <div class="meta"><span>PBKDF2-SHA256 · 600,000 iter · AES-GCM-256</span></div>
  </main>

 * set of content-interaction events specific to this paper.

 * One site tag keeps every event here separate from the CV and any other
 * site sharing the collector:
 *     site = 'agentic-discovery'

 * Two contexts, selected by window.__MYPA_CONTEXT__ (set by the inlined
 * config block just before this script):
 *   'gate'    — the locked landing page: a 'gate_view' plus the unlock funnel
 *               (unlock_attempt / unlock_success / unlock_fail / unlock_resumed,
 *               sent from the gate's own submit handler via window.mypa.send).
 *   'content' — the decrypted article / slides / traditions page: a 'pageview'
 *               plus full interaction tracking (clicks, language & theme
 *               switches, search, audio, downloads, section views, engagement).
 *
 * Survives the reveal: the gate decrypts and replaces the document with
 * document.write(); the same Window object is reused, so window.mypa persists.
 * The content bundle re-runs this script with __MYPA_CONTEXT__='content',

  var PAGE = window.__MYPA_PAGE__ || "unknown";

  if (!ENDPOINT) return;

  // Events that carry the one-time client-context payload (device/screen/etc).
  var ENRICH_EVENTS = { pageview: 1, gate_view: 1 };

  function utm() {

      var p = new URLSearchParams(window.location.search);
      return {

        medium: p.get("utm_medium") || null,

      };

  function clientContext() {

    try {
      ctx.screen_w = (window.screen && screen.width) || null;
      ctx.screen_h = (window.screen && screen.height) || null;
      ctx.viewport_w = window.innerWidth || null;
      ctx.viewport_h = window.innerHeight || null;
      ctx.dpr = window.devicePixelRatio || null;
      ctx.language = (navigator.language || "").slice(0, 16);
      ctx.languages = Array.isArray(navigator.languages)
        ? navigator.languages.slice(0, 4).join(",")
        : null;

        window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
      ctx.tz =
        (Intl &&
          Intl.DateTimeFormat &&
          new Intl.DateTimeFormat().resolvedOptions().timeZone) ||
        null;
      ctx.tz_offset = -new Date().getTimezoneOffset();

        navigator.connection ||
        navigator.mozConnection ||
        navigator.webkitConnection;
      if (c) {
        ctx.net_type = c.effectiveType || null;
        ctx.net_downlink = c.downlink || null;
        ctx.net_rtt = c.rtt || null;
        ctx.net_save_data = !!c.saveData;

      ctx.touch = "ontouchstart" in window || navigator.maxTouchPoints > 0;
      ctx.hardware_concurrency = navigator.hardwareConcurrency || null;
      ctx.device_memory = navigator.deviceMemory || null;
    } catch (e) {}
    return ctx;
  }

  // ── Transport ───────────────────────────────────────────────────────────
  // Built once per Window. Reused across the gate→content document.write so a
  // session keeps the same self-marker and avoids re-reading config twice.
  function buildTransport() {
    // Self-marker: visit once with ?_mypa_self=1 to flag your own visits as
    // {self:true}; ?_mypa_self=0 clears it. Persisted in localStorage.
    var SELF = false;
    try {
      var sp = new URLSearchParams(window.location.search);
      if (sp.get("_mypa_self") === "1") {
        try { localStorage.setItem("mypa_self", "1"); } catch (e) {}
      } else if (sp.get("_mypa_self") === "0") {
        try { localStorage.removeItem("mypa_self"); } catch (e) {}
      }
      try { SELF = localStorage.getItem("mypa_self") === "1"; } catch (e) {}
    } catch (e) {}

    function send(event, extra) {
      try {
        var ev = event || "pageview";
        var enriched = extra ? Object.assign({}, extra) : {};
        if (ENRICH_EVENTS[ev]) Object.assign(enriched, clientContext());
        var body = JSON.stringify({
          site: SITE,
          path: window.location.pathname + window.location.search,
          event: ev,
          referrer: document.referrer || "",
          utm: utm(),
          extra: Object.keys(enriched).length ? enriched : null,
          self: SELF || undefined,
        });

          navigator.sendBeacon &&
          navigator.sendBeacon(
            ENDPOINT,
            new Blob([body], { type: "text/plain;charset=UTF-8" })
          )
        ) {
          return;

          method: "POST",
          headers: { "content-type": "text/plain;charset=UTF-8" },
          body: body,
          keepalive: true,
          mode: "cors",
          credentials: "omit",
        }).catch(function () {});
      } catch (e) {}
    }

    return { send: send, __initialized: true, __self: SELF };
  }

  if (!window.mypa || !window.mypa.__initialized) {
    window.mypa = buildTransport();
  }
  var mypa = window.mypa;

  function onReady(fn) {
    if (
      document.readyState === "complete" ||
      document.readyState === "interactive"
    ) {
      fn();
    } else {
      document.addEventListener("DOMContentLoaded", fn);
    }
  }

  // ── Helpers shared by content tracking ──────────────────────────────────
  function clip(s, n) {
    if (s == null) return null;
    s = String(s).replace(/\s+/g, " ").trim();
    return s.length > n ? s.slice(0, n) : s;
  }

  // Best-effort human label for an interactive element.
  function labelFor(el) {
    if (!el) return null;
    var l =
      el.getAttribute("aria-label") ||
      el.getAttribute("data-i18n") ||
      el.getAttribute("title") ||
      (el.id ? "#" + el.id : "") ||
      el.textContent;
    return clip(l, 60);
  }

  // Nearest enclosing section id — gives every event a "where on the page".
  function sectionOf(el) {
    try {
      var sec = el.closest && el.closest("section[id], [id].page, [data-section]");
      return sec ? sec.id || sec.getAttribute("data-section") || null : null;
    } catch (e) {
      return null;
    }
  }

  // ── Content interaction tracking ────────────────────────────────────────
  function installContentTracking() {
    // 1) Delegated click capture — every interactive element logs *something*,
    //    with the most specific event name we can infer, falling back to a
    //    generic 'click' so no user action goes unrecorded.
    document.addEventListener(
      "click",
      function (e) {
        var t = e.target;
        if (!t || !t.closest) return;
        var section = sectionOf(t);

        // Language switch (.lang-btn[data-lang])
        var langBtn = t.closest(".lang-btn[data-lang]");
        if (langBtn) {
          mypa.send("lang_switch", {
            page: PAGE,
            lang: langBtn.getAttribute("data-lang"),
          });
          return;
        }

        // Theme cycle (#theme-cycle) — read the label it is about to become.
        if (t.closest("#theme-cycle")) {
          var tl = document.getElementById("theme-label");
          mypa.send("theme_switch", {
            page: PAGE,
            theme: tl ? clip(tl.textContent, 24) : null,
          });
          return;
        }

        // Collapse / expand all sections (#collapse-all-btn)
        var collapseAll = t.closest("#collapse-all-btn");
        if (collapseAll) {
          mypa.send("collapse_all", {
            page: PAGE,
            mode: collapseAll.getAttribute("data-mode") || null,
          });
          return;
        }

        // Downloads (markdown / podcast markdown)
        if (t.closest("#download-md-btn")) {
          mypa.send("download", { page: PAGE, what: "article_md" });
          return;
        }
        if (t.closest("#download-podcast-btn")) {
          mypa.send("download", { page: PAGE, what: "podcast_md" });
          return;
        }

        // Audio: open/close the dock, or pick a track.
        if (t.closest("#audio-toggle-btn")) {
          mypa.send("audio_toggle", { page: PAGE, action: "open" });
          return;
        }
        if (t.closest("#audio-player-close")) {
          mypa.send("audio_toggle", { page: PAGE, action: "close" });
          return;
        }
        var track = t.closest(".audio-track[data-src]");
        if (track) {
          mypa.send("audio_select", {
            page: PAGE,
            kind: track.getAttribute("data-kind"),
            lang: track.getAttribute("data-lang"),
          });
          return;
        }

        // Links — classify internal anchors, cross-page, and outbound.
        var a = t.closest("a[href]");
        if (a) {
          var href = a.getAttribute("href") || "";
          if (!href) return;
          if (href.charAt(0) === "#") {
            mypa.send("nav_jump", {
              page: PAGE,
              target: clip(href, 80),
              label: labelFor(a),
              section: section,
            });
            return;
          }
          if (/^(mailto:|tel:)/i.test(href)) {
            mypa.send("click", {
              page: PAGE,
              target: href.slice(0, 6),
              href: clip(href, 120),
              section: section,
            });
            return;
          }
          // Cross-page within the site (slides / traditions / example).
          if (/\.html(\?|#|$)/i.test(href) && !/^https?:/i.test(href)) {
            mypa.send("page_link", {
              page: PAGE,
              href: clip(href, 120),
              label: labelFor(a),
              section: section,
            });
            return;
          }
          if (/^https?:\/\//i.test(href)) {
            mypa.send("click", {
              page: PAGE,
              target: "outbound",
              href: clip(href, 120),
              section: section,
            });
            return;
          }
        }

        // Generic fallback for any other button / interactive control.
        var ctl = t.closest(
          'button, [role="button"], [role="tab"], summary, [data-action], .btn'
        );
        if (ctl) {
          mypa.send("click", {
            page: PAGE,
            label: labelFor(ctl),
            id: ctl.id || null,
            tag: ctl.tagName ? ctl.tagName.toLowerCase() : null,
            section: section,
          });
        }
      },
      true
    );

    // 2) Search use — send only the query *length*, never the query text.
    var searchInput = document.getElementById("paper-search-input");
    if (searchInput) {
      var searchTimer = null;
      searchInput.addEventListener("input", function () {
        if (searchTimer) clearTimeout(searchTimer);
        searchTimer = setTimeout(function () {
          var len = searchInput.value.trim().length;
          if (len > 0) mypa.send("search", { page: PAGE, q_len: len });
        }, 800);
      });
    }
    var searchClear = document.getElementById("paper-search-clear");
    if (searchClear) {
      searchClear.addEventListener("click", function () {
        mypa.send("search_clear", { page: PAGE });
      });
    }

    // 3) Audio playback milestones — capture native media events anywhere.
    document.addEventListener(
      "play",
      function (e) {
        var el = e.target;
        if (!el || el.tagName !== "AUDIO") return;
        var src = el.currentSrc || el.src || "";
        mypa.send("audio_play", { page: PAGE, src: clip(src.split("/").pop(), 60) });
      },
      true
    );
    document.addEventListener(
      "ended",
      function (e) {
        var el = e.target;
        if (!el || el.tagName !== "AUDIO") return;
        var src = el.currentSrc || el.src || "";
        mypa.send("audio_ended", { page: PAGE, src: clip(src.split("/").pop(), 60) });
      },
      true
    );

    // 4) Section views — fire once per section as it scrolls into view.
    try {
      if ("IntersectionObserver" in window) {
        var seen = {};
        var io = new IntersectionObserver(
          function (entries) {
            entries.forEach(function (en) {
              if (!en.isIntersecting) return;
              var id = en.target.id;
              if (!id || seen[id]) return;
              seen[id] = 1;
              var h = en.target.querySelector("h1, h2, h3, .page-title, .cover h1");
              mypa.send("section_view", {
                page: PAGE,
                id: id,
                title: h ? clip(h.textContent, 80) : null,
              });
            });
          },
          { threshold: 0.4 }
        );
        var sections = document.querySelectorAll("section[id], .page[id]");
        for (var i = 0; i < sections.length; i++) io.observe(sections[i]);
      }
    } catch (e) {}

    // 5) Engagement on exit — visible time, total time, max scroll depth.
    var startMs = Date.now();
    var visAccum = 0;
    var lastVis = document.visibilityState === "visible" ? Date.now() : 0;
    var maxScroll = 0;
    var sent = false;

    function updScroll() {
      try {
        var sh =
          document.documentElement.scrollHeight - window.innerHeight;
        if (sh <= 0) return;
        var pct = Math.round((window.scrollY / sh) * 100);
        if (pct > maxScroll) maxScroll = Math.min(100, pct);
      } catch (e) {}
    }
    window.addEventListener("scroll", updScroll, { passive: true });
    updScroll();

    function sendEngagement(reason) {
      if (sent) return;
      sent = true;
      if (lastVis) {
        visAccum += Date.now() - lastVis;
        lastVis = 0;
      }
      mypa.send("engagement_end", {
        page: PAGE,
        reason: reason,
        time_visible_ms: visAccum,
        time_total_ms: Date.now() - startMs,
        max_scroll_pct: maxScroll,
      });
    }
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "hidden") {
        sendEngagement("hidden");
      } else if (document.visibilityState === "visible" && sent) {
        // Re-arm for a possible second exit (SPA-ish long sessions).
        sent = false;
        startMs = Date.now();
        visAccum = 0;
        lastVis = Date.now();
      } else if (document.visibilityState === "visible") {
        lastVis = Date.now();
      }
    });
    window.addEventListener("pagehide", function () {
      sendEngagement("pagehide");
    });
  }

  // ── Auto behaviour per context ──────────────────────────────────────────
  if (CONTEXT === "gate") {
    if (!window.__mypaGateRan) {
      window.__mypaGateRan = true;
      onReady(function () {
        mypa.send("gate_view", { page: PAGE });
      });
    }
  } else {
    if (!window.__mypaContentRan) {
      window.__mypaContentRan = true;
      onReady(function () {
        mypa.send("pageview", { page: PAGE, stage: "content" });
        installContentTracking();
      });
    }
  }
})();

  <script>
  (() => {
    const PAYLOAD_EL = document.getElementById('payload');
    const PAYLOAD = JSON.parse(PAYLOAD_EL.textContent);
    PAYLOAD_EL.remove();

    const STORE_KEY = 'agentic-discovery:auth-v1';
    const TTL_MS = 24 * 60 * 60 * 1000;
    const td = new TextDecoder();
    const te = new TextEncoder();
    const b64dec = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

    async function deriveKey(password, salt) {
      const baseKey = await crypto.subtle.importKey(
        'raw', te.encode(password), 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt, iterations: 600000, hash: 'SHA-256' },
        baseKey,
        { name: 'AES-GCM', length: 256 },
        false, ['decrypt']);
    }

    async function decryptWith(password) {
      const key = await deriveKey(password, b64dec(PAYLOAD.salt));
      const pt = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: b64dec(PAYLOAD.iv) }, key,
        b64dec(PAYLOAD.ciphertext));
      return td.decode(pt);
    }

    function reveal(html) {
      document.open();
      document.write(html);
      document.close();
    }

    function getStored() {
      try {
        const raw = localStorage.getItem(STORE_KEY);
        if (!raw) return null;
        const o = JSON.parse(raw);
        if (!o || typeof o.p !== 'string' || typeof o.t !== 'number') return null;
        if (Date.now() - o.t > TTL_MS) { localStorage.removeItem(STORE_KEY); return null; }
        return o.p;
      } catch (e) { return null; }
    }
    function setStored(password) {
      try { localStorage.setItem(STORE_KEY, JSON.stringify({ p: password, t: Date.now() })); } catch (e) {}
    }

    // Analytics: no-op if the beacon failed to load. The content-context
    // beacon takes over inside the revealed document.
    const track = (event, extra) => {
      try { if (window.mypa && window.mypa.send) window.mypa.send(event, extra); } catch (e) {}
    };

    const stored = getStored();
    if (stored) {
      decryptWith(stored).then((html) => {
        track('unlock_resumed');
        reveal(html);
      }).catch(() => {});
    }

    document.getElementById('f').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const btn = document.getElementById('b');
      const err = document.getElementById('err');
      const pw = document.getElementById('pw').value;
      btn.disabled = true; btn.textContent = 'Decrypting…'; err.textContent = '';
      track('unlock_attempt');
      try {
        const html = await decryptWith(pw);
        setStored(pw);
        track('unlock_success');
        reveal(html);
      } catch (e) {
        track('unlock_fail');
        btn.disabled = false; btn.textContent = 'Unlock';
        err.textContent = 'Wrong password.';
        document.getElementById('pw').select();
      }
    });
  })();
  </script>
